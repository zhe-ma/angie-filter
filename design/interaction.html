<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AngieFilter 交互稿</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #141414;
    --panel: #1c1c1c;
    --line: rgba(255,255,255,.12);
    --muted: rgba(255,255,255,.62);
    --text: #f5f5f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    display: grid;
    grid-template-columns: minmax(420px, 1fr) 380px;
    gap: 28px;
    align-items: center;
    justify-items: center;
    padding: 32px 28px;
  }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }

  .stage-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .phone {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 48px;
    border: 10px solid #2a2a2a;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }
  .island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 5;
  }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: #000; }
  .view[hidden] { display: none; }

  .topbar {
    height: 96px;
    padding: 52px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 3;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 20px;
    display: grid;
    place-items: center;
    color: #fff;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn:disabled { opacity: .28; cursor: default; }
  .aspect-btn {
    min-width: 52px;
    height: 32px;
    padding: 0 10px;
    border-radius: 16px;
    border: 1.5px solid rgba(255,255,255,.85);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
  }

  .finder {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .frame {
    position: relative;
    overflow: hidden;
    background: #111;
    max-width: 100%;
    max-height: 100%;
  }
  .frame.bordered { background: #fff; }
  .photo {
    position: absolute;
    left: var(--pad-x, 0);
    top: var(--pad-top, 0);
    right: var(--pad-x, 0);
    bottom: var(--pad-bottom, 0);
    overflow: hidden;
  }
  .caption-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: var(--pad-bottom, 0);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 var(--pad-x, 0);
    color: rgba(0,0,0,.82);
    font-weight: 500;
    line-height: 1;
    pointer-events: none;
    white-space: nowrap;
  }
  .caption-bar[hidden] { display: none; }
  .caption-bar.only-custom { grid-template-columns: 1fr; }
  .cap-leading {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 0.55em;
    min-width: 0;
    overflow: hidden;
  }
  .cap-place { overflow: hidden; text-overflow: ellipsis; }
  .frame-place-note { margin: 0; font-size: 12px; color: rgba(255,255,255,.5); }
  .frame-place-note[hidden] { display: none; }
  .cap-custom {
    justify-self: center;
    max-width: 46%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .caption-bar.only-custom .cap-custom { max-width: 80%; }
  .cap-date { justify-self: end; }
  .stack { position: absolute; inset: 0; }
  .art {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 200%;
    height: 200%;
    transform: translate(-50%, -50%) scale(var(--zoom, 1));
    transform-origin: center;
    background:
      radial-gradient(circle at 24% 20%, rgba(255, 232, 170, .95) 0 34px, transparent 36px),
      radial-gradient(circle at 68% 58%, #f0c2a4 0 46px, transparent 48px),
      radial-gradient(circle at 76% 76%, #d23b32 0 34px, transparent 36px),
      linear-gradient(#d7a27a, #d7a27a) 60% 52% / 70px 120px no-repeat,
      linear-gradient(#2f6a38, #2f6a38) 10% 68% / 120px 90px no-repeat,
      linear-gradient(#3d7a44, #3d7a44) 78% 64% / 90px 110px no-repeat,
      linear-gradient(180deg, #67a4dc 0 46%, #9ec0df 46% 54%, #6d8d48 54% 72%, #8a6246 72% 100%);
  }
  .art.mirror { transform: translate(-50%, -50%) scale(var(--zoom, 1)) scaleX(-1); }
  .graded { opacity: var(--mix, 1); filter: var(--grade, none); }
  .grain {
    position: absolute;
    inset: -20%;
    pointer-events: none;
    opacity: var(--grain, 0);
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,.55) .6px, transparent .7px);
    background-size: 3px 3px;
  }
  .fade-wash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(92, 88, 82, var(--fade, 0));
  }
  .halation {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--halo, 0);
    mix-blend-mode: screen;
    background: radial-gradient(circle at 24% 20%, rgba(255, 86, 36, .9), transparent 28%);
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--vignette, 0);
    background: radial-gradient(circle, transparent 52%, rgba(0,0,0,.55) 100%);
  }
  .focus {
    position: absolute;
    width: 72px;
    height: 72px;
    border: 1.5px solid #ffe14a;
    border-radius: 2px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: focus .9s ease forwards;
  }
  @keyframes focus { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  .zoom-hud {
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
    opacity: 0;
    transition: opacity .2s;
  }
  .zoom-hud.show { opacity: 1; }

  .dock {
    padding: 8px 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 3;
  }
  .look-name { font-size: 13px; letter-spacing: .08em; color: rgba(255,255,255,.86); min-height: 16px; }
  .adjust-head { width: min(360px, 92%); display: flex; align-items: center; gap: 8px; }
  .adjust-notice { font-size: 12px; color: rgba(255,255,255,.55); }
  .adjust-toggle, .save-adjust {
    margin-left: auto;
    height: 28px;
    padding: 0 12px;
    border-radius: 14px;
    background: #fff;
    color: #111;
    font-size: 13px;
    font-weight: 600;
  }
  .adjust {
    width: min(360px, 92%);
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: rgba(255,255,255,.7);
    font-size: 12px;
  }
  .adjust[hidden] { display: none; }
  .adjust label { display: flex; align-items: center; gap: 8px; }
  .adjust input { flex: 1; accent-color: #fff; }
  .adjust label span { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .adjust-actions { display: flex; justify-content: space-between; align-items: center; }
  .adjust-actions button { color: rgba(255,255,255,.8); font-size: 13px; }
  .intensity {
    width: min(280px, 78%);
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .intensity.open { display: flex; }
  .intensity input { flex: 1; accent-color: #fff; }
  .families {
    width: 100%;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 0 16px 2px;
    scrollbar-width: none;
    justify-content: flex-start;
  }
  .families::-webkit-scrollbar { display: none; }
  .families button {
    flex: 0 0 auto;
    height: 28px;
    padding: 0 12px;
    border-radius: 14px;
    background: rgba(255,255,255,.1);
    font-size: 13px;
    color: rgba(255,255,255,.75);
  }
  .families button.active { background: #fff; color: #111; font-weight: 600; }
  .strip-wrap { width: 100%; overflow: hidden; }
  .strip {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 18px 2px;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .look {
    flex: 0 0 auto;
    width: 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,.55);
  }
  .thumb {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px rgba(255,255,255,.16);
  }
  .look.selected { color: #fff; }
  .look.selected .thumb { box-shadow: 0 0 0 2px #fff; }
  .thumb .art { width: 280%; height: 280%; }
  .thumb-label { font-size: 10px; letter-spacing: .02em; line-height: 1.25; text-align: center; }
  .zoom-row {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 8px;
    align-items: center;
    min-height: 28px;
  }
  .zoom-row button {
    min-width: 36px;
    height: 28px;
    padding: 0 8px;
    border-radius: 14px;
    background: rgba(0,0,0,.35);
    font-size: 13px;
    font-weight: 600;
  }
  .zoom-row button.active { background: #fff; color: #111; }
  .filter-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .filter-panel[hidden] { display: none; }
  .shutter-row {
    width: 100%;
    height: 96px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 22px;
  }
  .applied {
    justify-self: start;
    max-width: 96px;
    font-size: 13px;
    color: rgba(255,255,255,.86);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-btn {
    justify-self: end;
    min-width: 64px;
    height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    background: rgba(255,255,255,.18);
    font-size: 15px;
    font-weight: 600;
  }
  .filter-btn.open,
  .filter-btn.on { background: #fff; color: #111; }
  .shutter-side {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
  }
  .frame-btn {
    flex: 0 0 auto;
    min-width: 64px;
    height: 36px;
    padding: 0 14px;
    border-radius: 18px;
    background: rgba(255,255,255,.18);
    font-size: 15px;
    font-weight: 600;
  }
  .frame-btn.open,
  .frame-btn.on { background: #fff; color: #111; }
  .frame-panel {
    width: min(360px, 92%);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .frame-panel[hidden] { display: none; }
  .frame-choices { display: flex; gap: 8px; }
  .frame-choices button {
    height: 32px;
    padding: 0 14px;
    border-radius: 16px;
    background: rgba(255,255,255,.12);
    font-size: 13px;
  }
  .frame-choices button.active { background: #fff; color: #111; font-weight: 600; }
  .frame-fields { display: flex; flex-direction: column; gap: 8px; }
  .frame-fields[hidden] { display: none; }
  .frame-switches { display: flex; gap: 16px; font-size: 13px; color: rgba(255,255,255,.84); }
  .frame-switches label { display: flex; align-items: center; gap: 6px; }
  .frame-fields input[type="text"] {
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: rgba(255,255,255,.12);
    padding: 0 10px;
    font-size: 13px;
  }
  .shutter {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    border: 4px solid #fff;
    display: grid;
    place-items: center;
  }
  .shutter i {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #fff;
    display: block;
  }
  .shutter:active { transform: scale(.94); }
  .shutter:active i { transform: scale(.92); }

  .review-photo { flex: 1; min-height: 0; display: grid; place-items: center; }
  .review-bar {
    height: 118px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px 24px;
  }
  .text-btn { font-size: 17px; color: #fff; }
  .save-btn {
    height: 44px;
    padding: 0 22px;
    border-radius: 22px;
    background: #fff;
    color: #111;
    font-size: 17px;
    font-weight: 600;
  }
  .save-btn:disabled { opacity: .55; }

  .denied {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px;
    text-align: center;
  }
  .denied h2 { margin: 8px 0 0; font-size: 22px; font-weight: 600; }
  .denied p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .primary {
    margin-top: 12px;
    height: 44px;
    padding: 0 18px;
    border-radius: 22px;
    background: #fff;
    color: #111;
    font-weight: 600;
  }

  .notes { width: 100%; max-width: 380px; }
  .notes h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.02em; }
  .notes .lead { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 14px 12px;
    margin-bottom: 12px;
  }
  .card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .node {
    height: 32px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .node.active { background: #fff; color: #111; border-color: #fff; }
  .arrow { color: var(--muted); font-size: 12px; }
  .now { font-size: 15px; line-height: 1.55; margin: 0; }
  .hints { margin: 0; padding-left: 18px; color: rgba(255,255,255,.84); font-size: 14px; line-height: 1.7; }
  .caption { text-align: center; color: var(--muted); font-size: 12px; }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; padding: 16px; }
    .phone { transform: scale(.86); transform-origin: top center; margin-bottom: -110px; }
  }
</style>
</head>
<body>
  <div class="stage-wrap">
    <div class="phone" id="phone">
      <div class="island"></div>

      <section class="view" id="view-camera">
        <header class="topbar">
          <button class="icon-btn" id="flash" data-action="flash" aria-label="闪光灯">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
          </button>
          <button class="aspect-btn" id="aspect" data-action="aspect">4:3</button>
          <button class="icon-btn" id="flip" data-action="flip" aria-label="翻转摄像头">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8a8 8 0 0 1 14-2M20 16a8 8 0 0 1-14 2"/><path d="M18 2v4h-4M6 22v-4h4"/></svg>
          </button>
        </header>
        <div class="finder" id="finder">
          <div class="frame" id="frame">
            <div class="photo" id="photo">
              <div class="stack" id="stack">
                <div class="art"></div>
                <div class="art graded" id="graded"></div>
                <div class="grain" id="grain"></div>
                <div class="fade-wash" id="fade"></div>
                <div class="halation" id="halation"></div>
                <div class="vignette" id="vignette"></div>
              </div>
              <div class="zoom-hud" id="zoom-hud">1×</div>
              <div class="zoom-row" id="zoom-row"></div>
            </div>
            <div class="caption-bar" id="caption-bar" hidden>
              <span class="cap-leading"><span class="cap-model"></span><span class="cap-place"></span></span>
              <span class="cap-custom"></span>
              <span class="cap-date"></span>
            </div>
          </div>
        </div>
        <footer class="dock">
          <div class="frame-panel" id="frame-panel" hidden>
            <div class="frame-choices" id="frame-choices">
              <button data-action="frame-style" data-style="off">关闭</button>
              <button data-action="frame-style" data-style="white">白边</button>
              <button data-action="frame-style" data-style="captioned">白边带字</button>
            </div>
            <div class="frame-fields" id="frame-fields" hidden>
              <div class="frame-switches">
                <label><input id="frame-model" type="checkbox" checked>型号</label>
                <label><input id="frame-place" type="checkbox">地点</label>
                <label><input id="frame-date" type="checkbox" checked>日期</label>
              </div>
              <p class="frame-place-note" id="frame-place-note" hidden>未获得位置</p>
              <input id="frame-text" type="text" placeholder="一行短句" enterkeyhint="done">
            </div>
          </div>
          <div class="filter-panel" id="filter-panel" hidden>
            <div class="adjust-head">
              <div class="look-name" id="look-name">原图</div>
              <span class="adjust-notice" id="adjust-notice"></span>
              <button class="adjust-toggle" id="adjust-toggle" data-action="adjust" hidden>调节</button>
            </div>
            <div class="adjust" id="adjust" hidden>
              <label>强度 <input id="adj-intensity" data-adjust="intensity" type="range" min="0" max="100" value="100"><span id="adj-intensity-value">100</span></label>
              <label>褪色 <input id="adj-fade" data-adjust="fade" type="range" min="0" max="100" value="0"><span id="adj-fade-value">0</span></label>
              <label class="adjust-halo">光晕 <input id="adj-halation" data-adjust="halation" type="range" min="0" max="100" value="0"><span id="adj-halation-value">0</span></label>
              <label class="adjust-spatial">清晰度 <input id="adj-clarity" data-adjust="clarity" type="range" min="0" max="100" value="30"><span id="adj-clarity-value">30</span></label>
              <label class="adjust-spatial">颗粒 <input id="adj-grain" data-adjust="grain" type="range" min="0" max="100" value="0"><span id="adj-grain-value">0</span></label>
              <label class="adjust-spatial">暗角 <input id="adj-vignette" data-adjust="vignette" type="range" min="0" max="100" value="0"><span id="adj-vignette-value">0</span></label>
              <div class="adjust-actions">
                <button data-action="reset-adjust">恢复默认</button>
                <button class="save-adjust" data-action="save-adjust">保存</button>
              </div>
            </div>
            <div class="families" id="families"></div>
            <div class="strip-wrap"><div class="strip" id="strip"></div></div>
          </div>
          <div class="shutter-row">
            <div class="shutter-side">
              <button class="frame-btn" id="frame-toggle" data-action="frame" aria-pressed="false">相框</button>
              <div class="applied" id="applied"></div>
            </div>
            <button class="shutter" data-action="shutter" aria-label="快门"><i></i></button>
            <button class="filter-btn" id="filter-toggle" data-action="filters" aria-pressed="false">滤镜</button>
          </div>
        </footer>
      </section>

      <section class="view" id="view-review" hidden>
        <div class="review-photo" id="review-photo"></div>
        <footer class="review-bar">
          <button class="text-btn" data-action="retake">重拍</button>
          <button class="save-btn" id="save" data-action="save">保存</button>
        </footer>
      </section>

      <section class="view" id="view-denied" hidden>
        <div class="denied">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <h2>需要相机权限</h2>
          <p>AngieFilter 只用相机取景和拍摄。可以在设置里打开权限。</p>
          <button class="primary" data-action="settings">前往设置</button>
          <button class="text-btn" data-action="back-camera">返回取景</button>
        </div>
      </section>
    </div>
    <div class="caption">左侧「相框」选白边，右侧「滤镜」选风格。一次只展开一个面板。</div>
  </div>

  <aside class="notes">
    <h1>AngieFilter 交互</h1>
    <p class="lead">取景默认尽量大。左侧「相框」管白边，右侧「滤镜」管风格，一次只展开一个。</p>
    <div class="card">
      <h2>路径</h2>
      <div class="flow">
        <button class="node active" data-jump="camera" id="node-camera">取景</button>
        <span class="arrow">快门</span>
        <button class="node" data-jump="review" id="node-review">确认</button>
        <span class="arrow">保存</span>
        <button class="node" data-jump="camera" id="node-done">回到取景</button>
      </div>
      <div class="flow" style="margin-top:8px">
        <span class="arrow">确认页也可以</span>
        <button class="node" data-jump="camera">重拍</button>

function toneOf(look) {
  if (finish[look.id]) return { fade: finish[look.id][0], halation: finish[look.id][1] };
  if (look.scheme === "lut" && look.id.startsWith("lut-") && ["ziran","qingtou","wenrou","baixi","fennen","candyb","dannai","musi","zhuguang","huoli","qingchun"].some((name) => look.id.endsWith(name))) {
    return { fade: 8, halation: 0 };
  }
  if (look.scheme === "lut") return { fade: 6, halation: 0 };
  return { fade: 0, halation: 0 };
}
function baselineAdjust(look) {
  const tone = toneOf(look);
  if (look.scheme === "lut") {
    return {
      intensity: Math.round((look.strength || 0.8) * 100),
      fade: tone.fade,
      halation: tone.halation,
      clarity: 0,
      grain: 0,
      vignette: 0
    };
  }
  return {
    intensity: 100,
    fade: tone.fade,
    halation: tone.halation,
    clarity: 30,
    grain: Math.round((look.grain || 0) * 100),
    vignette: Math.round((look.vignette || 0) * 100)
  };
}
function activeAdjust(look) {
  if (look.id === "original") return baselineAdjust(look);
  if (state.adjustOpen) return state.draft;
  return state.memory[look.id] || baselineAdjust(look);
}
function applyGrade(root, look) {
  const adjust = activeAdjust(look);
  const mix = look.id === "original" ? 0 : adjust.intensity / 100;
  root.style.setProperty("--grade", look.grade);
  root.style.setProperty("--mix", String(mix));
  root.style.setProperty("--grain", String((adjust.grain / 100) * mix));
  root.style.setProperty("--fade", String((adjust.fade / 100) * mix * 0.55));
  root.style.setProperty("--halo", String((adjust.halation / 100) * mix));
  root.style.setProperty("--vignette", String((adjust.vignette / 100) * mix));
  root.style.setProperty("--zoom", String(state.zoom));
  root.querySelectorAll(".art").forEach((art) => art.classList.toggle("mirror", state.facing === "front"));
}

function renderAdjust() {
  const look = currentLook();
  const open = state.adjustOpen && look.id !== "original";
  $("adjust-toggle").hidden = look.id === "original";
  $("adjust-toggle").textContent = open ? "收起" : "调节";
  $("adjust").hidden = !open;
  $("adjust-notice").textContent = state.notice;
  document.querySelectorAll(".adjust-spatial").forEach((node) => {
    node.hidden = look.scheme === "lut";
  });
  document.querySelectorAll(".adjust-halo").forEach((node) => {
    node.hidden = toneOf(look).halation <= 0;
  });
  if (open) {
    for (const key of ["intensity", "fade", "halation", "clarity", "grain", "vignette"]) {
      const input = $(`adj-${key}`);
      if (!input) continue;
      input.value = String(state.draft[key]);
      $(`adj-${key}-value`).textContent = String(state.draft[key]);
    }
  }
}
function renderLook() {
  const look = currentLook();
  $("look-name").textContent = look.name;
  renderAdjust();
  applyGrade($("stack"), look);
  document.querySelectorAll(".look").forEach((node) => {
    node.classList.toggle("selected", node.dataset.id === look.id);
  });
  $("filter-panel").hidden = !state.filtersOpen;
  $("filter-toggle").classList.toggle("open", state.filtersOpen);
  $("filter-toggle").classList.toggle("on", look.id !== "original" && !state.filtersOpen);
  $("filter-toggle").setAttribute("aria-pressed", String(state.filtersOpen));
  const panelsOpen = state.filtersOpen || state.frameOpen;
  $("applied").textContent = !panelsOpen && look.id !== "original" ? look.name : "";
  renderFrame();
}

  if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderStrip() {

      <span class="thumb"><span class="art graded" style="--grade:${look.grade};--mix:${look.id === "original" ? 0 : 1};--zoom:1"></span></span>
      <span class="thumb-label">${look.name}</span>
    </button>
  `).join("");
  renderLook();
  const selected = strip.querySelector(".look.selected");
  if (selected) selected.scrollIntoView({ inline: "center", block: "nearest" });
}

function renderZoom() {
  const stops = zoomStops();
  if (state.facing === "front") state.zoom = 1;
  $("zoom-row").innerHTML = stops.map((stop) => {
    const active = Math.abs(state.zoom - stop) < 0.05;
    return `<button data-action="zoom" data-zoom="${stop}" class="${active ? "active" : ""}">${stop}</button>`;
  }).join("");
  $("zoom-hud").textContent = `${trimZoom(state.zoom)}×`;
  $("stack").style.setProperty("--zoom", String(state.zoom));
}

function trimZoom(value) {
  const rounded = Math.round(value * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function renderChrome() {
  $("aspect").textContent = state.aspect;
  $("flash").disabled = state.facing === "front";

  const flashTitle = { off: "闪光灯关", on: "闪光灯开", auto: "闪光灯自动" };
  $("flash").setAttribute("aria-label", state.facing === "front" ? "前置没有闪光灯" : flashTitle[state.flash]);
}

function frameGeometry() {
  const photo = { "4:3": 3 / 4, "16:9": 16 / 9, "1:1": 1 }[state.aspect];
  if (state.frameStyle === "off") return { ratio: photo, padX: 0, padTop: 0, padBottom: 0 };
  const short = Math.min(photo, 1);
  const outerW = photo + 0.09 * short;
  const outerH = 1 + 0.155 * short;
  return {
    ratio: outerW / outerH,
    padX: (0.045 * short) / outerW,
    padTop: (0.045 * short) / outerH,
    padBottom: (0.11 * short) / outerH
  };
}
function applyPads(frame) {
  const geo = frameGeometry();
  const on = state.frameStyle !== "off";
  frame.classList.toggle("bordered", on);
  frame.style.setProperty("--pad-x", on ? `${geo.padX * 100}%` : "0px");
  frame.style.setProperty("--pad-top", on ? `${geo.padTop * 100}%` : "0px");
  frame.style.setProperty("--pad-bottom", on ? `${geo.padBottom * 100}%` : "0px");
  return geo;
}
function formatDate(date) {
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${date.getFullYear()}.${month}.${day}`;
}
function clampGraphemes(text, max) {
  const parts = typeof Intl !== "undefined" && Intl.Segmenter
    ? [...new Intl.Segmenter("zh", { granularity: "grapheme" }).segment(text)].map((part) => part.segment)
    : [...text];
  return parts.slice(0, max).join("");
}
function fillCaption(bar, height) {
  if (!bar) return;
  const captioned = state.frameStyle === "captioned";
  bar.hidden = !captioned;
  if (!captioned) return;
  const model = state.showsModel ? "iPhone 13" : "";
  const place = state.showsPlace && !state.placeMissing ? "上海 · 徐汇区" : "";
  const custom = state.customText.trim();
  const date = state.showsDate ? formatDate(new Date()) : "";
  bar.querySelector(".cap-model").textContent = model;
  bar.querySelector(".cap-place").textContent = place;
  bar.querySelector(".cap-custom").textContent = custom;
  bar.querySelector(".cap-date").textContent = date;
  bar.classList.toggle("only-custom", Boolean(custom) && !model && !place && !date);
  if (height) bar.style.fontSize = `${Math.max(8, height * 0.28)}px`;
}
function renderFrame() {
  const open = state.frameOpen;
  $("frame-panel").hidden = !open;
  $("frame-toggle").classList.toggle("open", open);
  $("frame-toggle").classList.toggle("on", state.frameStyle !== "off");
  $("frame-toggle").setAttribute("aria-pressed", String(open));
  $("frame-fields").hidden = state.frameStyle !== "captioned";
  document.querySelectorAll("#frame-choices button").forEach((button) => {
    button.classList.toggle("active", button.dataset.style === state.frameStyle);
  });
  $("frame-model").checked = state.showsModel;
  $("frame-place").checked = state.showsPlace;
  $("frame-place-note").hidden = !(state.frameStyle === "captioned" && state.showsPlace && state.placeMissing);
  $("frame-date").checked = state.showsDate;
  if (document.activeElement !== $("frame-text")) $("frame-text").value = state.customText;
  const geo = applyPads($("frame"));
  fillCaption($("caption-bar"), $("frame").clientHeight * geo.padBottom);
}

function layoutFrame() {
  const finder = $("finder");
  const frame = $("frame");
  if (!finder || !frame) return;
  const geo = frameGeometry();
  let width = finder.clientWidth;
  let height = width / geo.ratio;
  if (height > finder.clientHeight) {
    height = finder.clientHeight;
    width = height * geo.ratio;
  }
  frame.style.width = `${width}px`;
  frame.style.height = `${height}px`;
  applyPads(frame);
  fillCaption($("caption-bar"), height * geo.padBottom);
}

function paintReview() {
  const look = currentLook();
  $("review-photo").innerHTML = `
    <div class="frame" id="review-frame">
      <div class="photo">
        <div class="stack" id="review-stack">
          <div class="art"></div>
          <div class="art graded"></div>
          <div class="grain"></div>
          <div class="fade-wash"></div>
          <div class="halation"></div>
          <div class="vignette"></div>
        </div>
      </div>
      <div class="caption-bar">
        <span class="cap-leading"><span class="cap-model"></span><span class="cap-place"></span></span>
        <span class="cap-custom"></span>
        <span class="cap-date"></span>
      </div>
    </div>`;
  const host = $("review-photo");
  const frame = $("review-frame");
  const geo = frameGeometry();
  let width = host.clientWidth || 370;
  let height = width / geo.ratio;
  const limit = host.clientHeight || 700;
  if (height > limit) {
    height = limit;
    width = height * geo.ratio;
  }
  frame.style.width = `${width}px`;
  frame.style.height = `${height}px`;
  applyPads(frame);
  fillCaption(frame.querySelector(".caption-bar"), height * geo.padBottom);
  applyGrade($("review-stack"), look);
}

function flashOverlay() {
  if (state.facing !== "back" || state.flash === "off") return;
  const veil = document.createElement("div");
  veil.style.cssText = "position:absolute;inset:0;background:#fff;z-index:4;pointer-events:none";
  $("view-camera").appendChild(veil);
  requestAnimationFrame(() => {
    veil.style.transition = "opacity .18s";
    veil.style.opacity = "0";
  });
  setTimeout(() => veil.remove(), 200);
}

function openAdjust(look) {
  state.draft = { ...(state.memory[look.id] || baselineAdjust(look)) };
  state.adjustOpen = true;
  state.notice = "";
}
function onLook(id) {
  const look = currentList().find((item) => item.id === id);
  if (!look) return;
  if (state.lookId === id && id !== "original") {
    if (state.adjustOpen) {
      state.adjustOpen = false;
      explain("调节收起。没点保存的改动不会留下。");
    } else {
      openAdjust(look);
      explain(`调节「${look.name}」。改完点保存，这次打开里会记住。`);
    }
  } else {
    state.lookId = id;
    state.adjustOpen = false;
    state.notice = "";
    explain(id === "original"
      ? "回到原图。原图不能调节。"
      : `已套用「${look.name}」。${look.about}可以点调节改参数。`);
  }
  renderLook();
}

$("phone").addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]");
  if (!target || target.disabled) return;
  const action = target.dataset.action;
  if (action === "filters") {
    const opening = !state.filtersOpen;
    state.filtersOpen = !state.filtersOpen;
    if (state.filtersOpen) state.frameOpen = false;
    if (!state.filtersOpen) state.adjustOpen = false;
    if (opening) state.familyId = familyOfLook(state.lookId).id;
    renderStrip();
    renderFrame();
    requestAnimationFrame(layoutFrame);
    if (state.filtersOpen) {
      explain("滤镜面板打开。上面选分类，下面是这一类的预览。相框面板已收起。");
    } else {
      explain("滤镜面板收起，取景区域恢复。");
    }
  } else if (action === "frame") {
    state.frameOpen = !state.frameOpen;
    if (state.frameOpen) {
      state.filtersOpen = false;
      state.adjustOpen = false;
    }
    renderLook();
    renderFrame();
    requestAnimationFrame(layoutFrame);
    explain(state.frameOpen
      ? "相框面板打开。可选关闭、白边、白边带字。滤镜面板已收起。"
      : "相框面板收起。当前样式留在这次打开里。");
  } else if (action === "frame-style") {
    state.frameStyle = target.dataset.style;
    renderFrame();
    layoutFrame();
    const label = { off: "关闭。画面回到裁切比例。", white: "白边。四周留白，底部更宽，没有字。", captioned: "白边带字。型号和日期默认开着，地点默认关，可以再写一行短句。" };
    explain(label[state.frameStyle]);
  } else if (action === "family") {
    state.familyId = target.dataset.id;
    state.adjustOpen = false;
    renderStrip();
    explain(`分类换成「${familyById(state.familyId).name}」。点下面的缩略图才会套用。`);
  } else if (action === "look") {
    onLook(target.dataset.id);
  } else if (action === "zoom") {
    state.zoom = Number(target.dataset.zoom);
    renderZoom();
    renderLook();
    explain(`变焦到 ${trimZoom(state.zoom)}×。这是镜头倍数，不是把照片放大裁切。`);
  } else if (action === "aspect") {
    const order = ["4:3", "16:9", "1:1"];
    state.aspect = order[(order.indexOf(state.aspect) + 1) % order.length];
    renderChrome();
    layoutFrame();
    explain(`画幅改为 ${state.aspect}。黑边以外的部分不会进入成片。`);
  } else if (action === "flash") {
    const order = ["off", "on", "auto"];
    state.flash = order[(order.indexOf(state.flash) + 1) % order.length];
    renderChrome();
    const label = { off: "关闭", on: "打开", auto: "自动" };
    explain(`闪光灯${label[state.flash]}。前置摄像头没有这一项。`);
  } else if (action === "flip") {
    state.facing = state.facing === "back" ? "front" : "back";
    if (state.facing === "front") state.zoom = 1;
    renderZoom();
    renderChrome();
    renderLook();
    explain(state.facing === "front" ? "切到前置。画面镜像，变焦只保留 1×，闪光灯不可用。保存时也会保持这个镜像。" : "切回后置。变焦档位恢复。");
  } else if (action === "shutter") {
    flashOverlay();
    showScreen("review");
    explain("快门拍下的就是取景里这一帧。确认页不再改风格。");
  } else if (action === "retake") {
    showScreen("camera");
    explain("重拍。刚才的风格、相框、画幅和变焦都还在。");
  } else if (action === "save") {
    const button = $("save");
    button.disabled = true;
    button.textContent = "保存中";
    explain("正在写入相册。");
    setTimeout(() => {
      button.disabled = false;
      button.textContent = "保存";
      showScreen("camera");
      explain("已保存到最近项目，回到取景，可以继续拍下一张。");
    }, 700);
  } else if (action === "settings") {
    explain("这里会离开应用，打开系统设置里的相机权限。");
  } else if (action === "back-camera") {
    showScreen("camera");
    explain("回到取景。");
  } else if (action === "adjust") {
    const look = currentLook();
    if (state.adjustOpen) {
      state.adjustOpen = false;
      explain("调节收起。没点保存的改动不会留下。");
    } else {
      openAdjust(look);
      explain(`调节「${look.name}」。改完点保存，这次打开里会记住。`);
    }
    renderLook();
  } else if (action === "reset-adjust") {
    state.draft = baselineAdjust(currentLook());
    state.notice = "";
    renderLook();
    explain("滑杆回到这款滤镜的默认参数。要点保存才会写进内存。");
  } else if (action === "save-adjust") {
    const look = currentLook();
    const base = baselineAdjust(look);
    const same = ["intensity", "fade", "halation", "clarity", "grain", "vignette"].every((key) => state.draft[key] === base[key]);
    if (same) delete state.memory[look.id];
    else state.memory[look.id] = { ...state.draft };
    state.notice = "已保存";
    renderLook();
    explain(`「${look.name}」的参数已保存在这次打开的内存里。`);
  }
});

$("finder").addEventListener("click", (event) => {
  if (event.target.closest("[data-action]")) return;
  const frame = $("frame");
  const photo = $("photo");
  const frameRect = frame.getBoundingClientRect();
  const photoRect = photo.getBoundingClientRect();
  const x = event.clientX;
  const y = event.clientY;
  const inFrame = x >= frameRect.left && y >= frameRect.top && x <= frameRect.right && y <= frameRect.bottom;
  if (!inFrame) return;
  if (state.filtersOpen || state.frameOpen) {
    state.filtersOpen = false;
    state.frameOpen = false;
    state.adjustOpen = false;
    renderLook();
    requestAnimationFrame(layoutFrame);
  }
  const inPhoto = x >= photoRect.left && y >= photoRect.top && x <= photoRect.right && y <= photoRect.bottom;
  if (!inPhoto) {
    explain("点在白边上，只收起面板，不对焦。");
    return;
  }
  photo.querySelectorAll(".focus").forEach((node) => node.remove());
  const mark = document.createElement("div");
  mark.className = "focus";
  mark.style.left = `${x - photoRect.left}px`;
  mark.style.top = `${y - photoRect.top}px`;
  photo.appendChild(mark);
  setTimeout(() => mark.remove(), 900);
  explain("对焦到点击的位置。对焦框会自己消失。");
});

$("finder").addEventListener("wheel", (event) => {
  if (state.screen !== "camera" || state.facing === "front") return;
  event.preventDefault();
  const next = Math.min(5, Math.max(0.5, state.zoom + (event.deltaY > 0 ? -0.1 : 0.1)));
  state.zoom = Math.round(next * 10) / 10;
  renderZoom();
  renderLook();
  $("zoom-hud").classList.add("show");
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(() => $("zoom-hud").classList.remove("show"), 700);
}, { passive: false });

$("frame-model").addEventListener("change", () => {
  state.showsModel = $("frame-model").checked;
  renderFrame();
  explain(state.showsModel ? "底栏左侧显示 iPhone 13。" : "型号已关掉。再打开「白边带字」时还会记得这个开关。");
});
$("frame-place").addEventListener("change", () => {
  state.showsPlace = $("frame-place").checked;
  state.placeMissing = false;
  renderFrame();
  explain(state.showsPlace
    ? "地点打开。底栏在型号旁边印上上海 · 徐汇区。真机上会先请求位置；没有结果时面板写「未获得位置」，这句不进照片。"
    : "地点已关掉。底栏不再印城市。");
});
$("frame-date").addEventListener("change", () => {
  state.showsDate = $("frame-date").checked;
  renderFrame();
  explain(state.showsDate ? "底栏右侧显示今天的日期。" : "日期已关掉。");
});
$("frame-text").addEventListener("input", () => {
  const next = clampGraphemes($("frame-text").value, 12);
  if (next !== $("frame-text").value) $("frame-text").value = next;
  state.customText = next;
  renderFrame();
});
$("frame-text").addEventListener("keydown", (event) => {
  if (event.key !== "Enter") return;
  event.preventDefault();
  event.target.blur();
  explain(state.customText.trim() ? "短句写在底栏中间。回车收起键盘。" : "空白不会印出来。");
});

$("adjust").addEventListener("input", (event) => {
  const key = event.target.dataset.adjust;
  if (!key) return;
  state.draft[key] = Number(event.target.value);
  state.notice = "";
  renderLook();
});

document.querySelector(".notes").addEventListener("click", (event) => {
  const jump = event.target.closest("[data-jump]");
  if (!jump) return;
  const screen = jump.dataset.jump;
  showScreen(screen);
  if (screen === "denied") explain("还没有相机权限。取景控件先不出现。");
  if (screen === "review") explain("从路径图直接看确认页。");
  if (screen === "camera") explain("回到取景。");
});

window.addEventListener("resize", () => {
  if (state.screen === "camera") layoutFrame();
  if (state.screen === "review") paintReview();
});

renderStrip();
renderZoom();
renderChrome();
showScreen("camera");
requestAnimationFrame(layoutFrame);
</script>
</body>
</html>
